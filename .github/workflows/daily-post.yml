name: Daily Buttondown post

on:
  schedule:
    # 02:47 UTC = 11:47 JST, every day.
    #
    # Deliberately not on the hour. GitHub's scheduler queues every repository
    # firing at the same minute, and :00 is by far the most contested — the
    # first run of this workflow at 03:00 UTC did not start until 07:57 UTC,
    # almost five hours late. An odd minute avoids that pile-up, and starting
    # 13 minutes early leaves room for the delay that remains, so a normal day
    # lands near 12:00 JST.
    #
    # It is still best-effort: GitHub makes no latency guarantee for scheduled
    # workflows and drops them entirely if the repository goes 60 days without
    # activity. Do not depend on the exact minute.
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Beat to write about'
        required: false
        default: ''
        type: choice
        options: ['', 'culture', 'healthcare']
      topic:
        description: 'Override the seed topic (optional)'
        required: false
        default: ''
      dry_run:
        description: 'Generate only, do not publish'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-buttondown-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to commit the publish history back

    steps:
      - uses: actions/checkout@v5

      # Fail in seconds with an actionable message rather than after a full
      # dependency install with one that talks about a .env file CI does not have.
      - name: Check required secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          missing=""
          [ -n "$ANTHROPIC_API_KEY" ]  || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$BUTTONDOWN_API_KEY" ] || missing="$missing BUTTONDOWN_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under: Settings -> Secrets and variables -> Actions"
            echo "  * Use the \"Repository secrets\" section."
            echo "  * \"Environment secrets\" are NOT readable here - this job declares no 'environment:'."
            echo "  * \"Variables\" is a separate tab and is not readable through secrets.*"
            exit 1
          fi
          echo "Required secrets are present."

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT || 'high' }}
          ANTHROPIC_MAX_TOKENS: ${{ vars.ANTHROPIC_MAX_TOKENS || '16000' }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BUTTONDOWN_EMAIL_STATUS: ${{ vars.BUTTONDOWN_EMAIL_STATUS || 'about_to_send' }}
          BUTTONDOWN_EMAIL_TYPE: ${{ vars.BUTTONDOWN_EMAIL_TYPE || 'public' }}
          BUTTONDOWN_EDITOR_MODE: ${{ vars.BUTTONDOWN_EDITOR_MODE || 'auto' }}
          SUBSCRIPTION_PRICE_CENTS: ${{ vars.SUBSCRIPTION_PRICE_CENTS || '500' }}
          TOPIC_CATEGORY: ${{ vars.TOPIC_CATEGORY || 'mixed' }}
          TARGET_WORD_COUNT: ${{ vars.TARGET_WORD_COUNT || '1600' }}
          SEO_RELATED_LINKS: ${{ vars.SEO_RELATED_LINKS || '3' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.category }}" ]; then ARGS="$ARGS --category ${{ inputs.category }}"; fi
          if [ -n "${{ inputs.topic }}" ]; then ARGS="$ARGS --topic \"${{ inputs.topic }}\""; fi
          eval "npx tsx src/index.ts $ARGS"

      - name: Persist publish history
        if: success() && inputs.dry_run != true
        run: |
          # data/articles holds the article bodies. `npm run reddit` reads them,
          # so committing only published.json would leave every cloud-published
          # article impossible to promote later.
          git add data/history data/published.json data/articles
          if git diff --cached --quiet; then
            echo "No history change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record published article [skip ci]"
          # Another run may have landed while this one was generating.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
